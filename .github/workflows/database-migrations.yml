name: Database migrations

on:
  pull_request:
    paths:
      - '.github/workflows/database-migrations.yml'
      - 'lib/database-url.ts'
      - 'package.json'
      - 'prisma/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/database-migrations.yml'
      - 'lib/database-url.ts'
      - 'package.json'
      - 'prisma/**'
      - 'scripts/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fresh_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      FRESH_DATABASE_URL: mysql://root@127.0.0.1:3306/fresh_migration_test
      LEGACY_DATABASE_URL: mysql://root@127.0.0.1:3306/legacy_migration_test
      SERVER_DATABASE_URL: mysql://root@127.0.0.1:3306/mysql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and generate Prisma Client
        run: npm ci

      - name: Apply all migrations to a fresh database
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.FRESH_DATABASE_URL }}

      - name: Verify fresh database matches schema.prisma
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
          node scripts/verify-migrated-database.mjs
        env:
          DATABASE_URL: ${{ env.FRESH_DATABASE_URL }}

      - name: Test content CRUD, validation, transactions and uploads
        run: |
          npm test
          npm run test:functions
        env:
          DATABASE_URL: ${{ env.FRESH_DATABASE_URL }}

      - name: Test database backup and restore
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          BACKUP_DIR="$RUNNER_TEMP/backups" npm run db:backup > "$RUNNER_TEMP/backup-path.txt"
          mysql -h 127.0.0.1 -P 3306 -uroot -e 'DROP DATABASE IF EXISTS restore_validation_test; CREATE DATABASE restore_validation_test;'
          DATABASE_URL='mysql://root@127.0.0.1:3306/restore_validation_test' npm run db:restore -- "$(tail -n 1 "$RUNNER_TEMP/backup-path.txt")"
          DATABASE_URL='mysql://root@127.0.0.1:3306/restore_validation_test' node scripts/verify-migrated-database.mjs
        env:
          DATABASE_URL: ${{ env.FRESH_DATABASE_URL }}

      - name: Create a representative legacy database
        run: |
          ADMIN_DATABASE_URL="$SERVER_DATABASE_URL" \
            TEST_DATABASE_NAME="legacy_migration_test" \
            node scripts/create-test-database.mjs
          DATABASE_URL="$LEGACY_DATABASE_URL" npx prisma db execute \
            --file prisma/migrations/20260823142054_init_service_schema/migration.sql
          DATABASE_URL="$LEGACY_DATABASE_URL" npx prisma db execute \
            --file prisma/migrations/20260915101500_add_login_rate_limit/migration.sql
          DATABASE_URL="$LEGACY_DATABASE_URL" npx prisma migrate resolve \
            --applied 20260823142054_init_service_schema
          DATABASE_URL="$LEGACY_DATABASE_URL" npx prisma migrate resolve \
            --applied 20260915101500_add_login_rate_limit

      - name: Seed legacy rows before migration
        run: |
          printf '%s\n' \
            "INSERT INTO \`Category\` (\`id\`,\`name\`,\`slug\`,\`createdAt\`,\`updatedAt\`) VALUES ('category-1','Legacy','legacy',NOW(3),NOW(3));" \
            "INSERT INTO \`Article\` (\`id\`,\`title\`,\`slug\`,\`content\`,\`categoryId\`,\`createdAt\`,\`updatedAt\`) VALUES ('article-1','Legacy article','legacy-article','Content','category-1',NOW(3),NOW(3));" \
            "INSERT INTO \`Redirect\` (\`id\`,\`source\`,\`destination\`,\`permanent\`,\`createdAt\`) VALUES ('redirect-1','/legacy-permanent','/new-permanent',true,NOW(3)),('redirect-2','/legacy-temporary','/new-temporary',false,NOW(3));" \
            "INSERT INTO \`LoginRateLimit\` (\`key\`,\`attempts\`,\`windowStartedAt\`,\`updatedAt\`) VALUES ('legacy-client',2,NOW(3),NOW(3));" \
            | DATABASE_URL="$LEGACY_DATABASE_URL" npx prisma db execute --stdin
          DATABASE_URL="$LEGACY_DATABASE_URL" node scripts/database-row-counts.mjs > /tmp/counts-before.json

      - name: Migrate the legacy database without data loss
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.LEGACY_DATABASE_URL }}

      - name: Verify legacy rows and final schema
        run: |
          node scripts/database-row-counts.mjs > /tmp/counts-after.json
          diff -u /tmp/counts-before.json /tmp/counts-after.json
          node scripts/verify-migrated-database.mjs
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: ${{ env.LEGACY_DATABASE_URL }}
          EXPECT_LEGACY_FIXTURE: '1'
